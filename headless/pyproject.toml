[project]
name = "headless-cordis-plugin"
version = "0.1.0"
description = "bh-02 with no terminal: a ui row that sends one task, records what bh-02 shows and asks, and ends the session when the reply is done or the budget runs out."
requires-python = ">=3.15"
dependencies = ["cordis"]

[project.entry-points."cordis.plugins"]
headless = "headless_cordis_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headless_cordis_plugin"]
