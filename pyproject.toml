[project]
name = "bh02-lab"
version = "0.1.0"
description = "The lab where bh-02 and the model it drives improve together: rollouts, a judge bh-02 cannot touch, and a gate that decides what is promoted."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
modal = [
    "modal>=1.2",
    "fastapi>=0.115",
]

[project.scripts]
bh02-lab = "bh02_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bh02_lab"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider", "--doctest-modules"]
consider_namespace_packages = true
markers = ["modal: needs Modal credentials and deployed apps; run only when asked"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["battery/*/*/repo", "battery/*/*/reference", "headless"]

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "undocumented-public-class", "undocumented-public-function", "docstring-missing-exception", "docstring-extraneous-exception"]
ignore = ["ambiguous-unicode-character-string"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["undocumented-public-class", "undocumented-public-function", "docstring-missing-exception", "docstring-extraneous-exception"]
"battery/**" = ["undocumented-public-class", "undocumented-public-function", "docstring-missing-exception", "docstring-extraneous-exception"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/bh02_lab", "tests"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["modal", "modal.*", "fastapi", "fastapi.*", "datasets", "trl", "unsloth", "unsloth.*"]  # GPU-only packages live in the Modal image
ignore_missing_imports = true

# The architecture gate: `scripts/arch-check` (it indexes first; a bare `pypeeker check` against a
# missing index passes silently). The core imports nothing that does I/O on the network or knows
# Modal; the sandbox program imports nothing of the lab; only modal_apps knows Modal.
[tool.pypeeker]
src = ["src"]
rules = ["import-boundaries", "no-import-cycles", "under-exposed-access"]

[tool.pypeeker.import-boundaries]
root = "bh02_lab"
strict = true  # a new module must be declared below

[tool.pypeeker.import-boundaries.allow]
contract = []                               # the wire values; pure
hashing = []                                # content hashes; pure
stats = []                                  # score, band, paired difference; pure
snapshot = ["hashing"]                      # tar bytes <-> entries; reads a directory in read_tree only
pins = ["hashing"]                          # pins.toml as values, the serving hash
battery = ["hashing", "snapshot"]           # tasks, the check command, the verdict rule
rollout_core = ["hashing", "snapshot"]       # what a finished rollout was; pure
gate_core = ["contract", "stats"]           # what a battery run asks and adds up to; pure
gate_api = ["contract", "gate_core"]        # the HTTPS API over injected stores
cli = []                                    # the lab lead's tool: HTTP only
proof = []                                  # the training proof's data and pass rule; pure
sandbox = []                                # runs inside the rollout sandbox: standard library only
modal_apps = ["battery", "contract", "gate_api", "gate_core", "hashing", "pins", "proof", "rollout_core", "snapshot", "stats"]
