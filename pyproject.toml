[project]
name = "bh02-lab"
version = "0.1.0"
description = "The lab where bh-02 and the model it drives improve together: rollouts, a judge bh-02 cannot touch, and a gate that decides what is promoted."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
modal = [
    "modal>=1.2",
    "fastapi>=0.115",
]

[project.scripts]
bh02-lab = "bh02_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bh02_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider"]
consider_namespace_packages = true
markers = ["modal: needs Modal credentials and deployed apps; run only when asked"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["battery/*/*/repo", "battery/*/*/reference", "headless"]

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D101", "D103", "DOC501", "DOC502"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D103", "DOC501", "DOC502"]
"battery/**" = ["D101", "D103", "DOC501", "DOC502"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/bh02_lab", "tests"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["modal", "modal.*", "fastapi", "fastapi.*"]
ignore_missing_imports = true
