# What a lab run is pinned to. Every rollout records the hashes these make; change a pin and the
# hashes change with it, so results from before and after are never mixed.

[bh02]
repo = "https://github.com/bruk-io/bh-02"
sha = "dc4bd33cf73bbcfc02089f91c47a0b4906f5a9b8"
python = "3.15"

[model]
repo = "ornith-ai/Ornith-1.5-9B"
revision = "489cb97981b8654bcfcf30ce1f94ed1b62e07b53"
served_name = "Ornith-1.5-9B"
temperature = 0.6  # sent by bh-02 per request (the card's setting for precise coding)

[serving]
vllm = "0.19.1"
gpu = "L40S"
max_model_len = 65536
args = [
    "--enable-prefix-caching",
    "--enable-auto-tool-choice",
    "--tool-call-parser", "qwen3_xml",
    "--reasoning-parser", "qwen3",
    "--trust-remote-code",
    "--gpu-memory-utilization", "0.90",
]
# What bh-02 does not send, the server applies: the card's precise-coding sampling.
generation = { top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repetition_penalty = 1.0 }

[rollout]
budget_s = 1500
# "bh-02": bh-02's own jail inside the sandbox (bubblewrap); "sandbox": --no-jail, the sandbox is the
# only jail and every question is answered yes. TASK-0001.04 decides which runs on Modal.
jail = "bh-02"
